<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rank NBA teams by bonus free-throw attempts, accuracy, and win rate for any season.">
  <title>Season Leaderboard · NBA Bonus Study</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap');
    :root{--court:#d7a05c;--court-light:#e9bd7c;--court-dark:#c48b49;--navy:#102b58;--line:#173568;--cream:#fff1d2;--ink:#152744;--muted:#354968;--accent:#b95832}
    *{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--ink);font:18px/1.45 'Barlow Condensed','Arial Narrow',Arial,sans-serif}
    header,footer{padding:15px clamp(18px,4vw,54px);color:var(--cream);background:var(--navy)}
    header{display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:4px solid var(--accent)}
    .brand{font-weight:900;letter-spacing:.1em;text-transform:uppercase}nav{display:flex;gap:16px;flex-wrap:wrap}
    nav a{color:var(--cream);font-weight:800;text-decoration:none}nav a:hover,nav a:focus-visible,nav a[aria-current=page]{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
    main{position:relative;isolation:isolate;min-height:100vh;padding:clamp(26px,5vw,64px) clamp(16px,5vw,72px);overflow:hidden;background-color:var(--court);background-image:radial-gradient(circle at 50% 50%,transparent 0 150px,rgba(23,53,104,.23) 152px 155px,transparent 157px),linear-gradient(90deg,transparent calc(50% - 2px),rgba(23,53,104,.18) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 2px)),repeating-linear-gradient(0deg,rgba(103,62,27,.1) 0 2px,transparent 2px 58px),repeating-linear-gradient(90deg,rgba(255,245,220,.14) 0 2px,transparent 2px 172px),linear-gradient(110deg,var(--court-light),var(--court) 56%,var(--court-dark))}
    main:before{content:"";position:absolute;z-index:-1;inset:12px clamp(10px,1.8vw,28px);border:4px solid rgba(23,53,104,.72);pointer-events:none}main>*{position:relative;z-index:1}
    .wrap{max-width:1120px;margin:auto}.intro{text-align:center;margin:0 auto 24px}.eyebrow{color:var(--line);font-size:.94rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase}
    h1,h2,h3{margin:0;color:var(--navy);font-weight:900;line-height:1.08;text-transform:uppercase}h1{font-size:clamp(2.4rem,6vw,4.3rem)}h2{font-size:clamp(1.5rem,3vw,2rem)}
    .panel{margin:22px 0;padding:clamp(18px,3vw,30px);background:rgba(255,241,210,.92);border:4px solid var(--line)}
    .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.control label{display:block;margin-bottom:6px;color:var(--navy);font-weight:900;text-transform:uppercase;letter-spacing:.04em}
    .season-control-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
    .season-control-row input[type=range]{width:100%;accent-color:var(--navy);cursor:pointer}
    .season-control-row output{min-width:68px;color:var(--navy);font-size:1.15rem;font-weight:900;text-align:right}
    .play-toggle{min-height:42px;padding:8px 14px;color:var(--cream);background:var(--navy);border:3px solid var(--line);font:800 1rem 'Barlow Condensed','Arial Narrow',Arial,sans-serif;cursor:pointer;white-space:nowrap}
    .play-toggle:hover,.play-toggle:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    select{width:100%;min-height:48px;padding:9px 40px 9px 12px;border:3px solid var(--line);border-radius:0;color:var(--navy);background:var(--cream);font:700 1.1rem 'Barlow Condensed','Arial Narrow',Arial,sans-serif}
    select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .leaderboard-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}
    .metric-caption{margin:5px 0 0;color:var(--muted)}.ranking{display:grid;gap:9px}
    .rank-row{--team-color:var(--line);display:grid;grid-template-columns:42px 52px minmax(120px,1fr) minmax(100px,1.25fr) 105px;align-items:center;gap:12px;min-height:66px;padding:8px 12px;color:var(--ink);background:rgba(233,189,124,.48);border:2px solid rgba(23,53,104,.35);border-left:6px solid var(--team-color);text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}
    .rank-row:hover,.rank-row:focus-visible{transform:translateX(3px);box-shadow:0 4px 12px rgba(16,43,88,.18);outline:3px solid var(--team-color);outline-offset:2px}
    .rank-number{text-align:center;color:var(--navy);font-size:1.3rem;font-weight:900}.rank-logo{width:46px;height:46px;object-fit:contain;padding:3px;background:var(--cream);border-radius:50%}
    .rank-name{font-size:1.15rem;font-weight:800}.meter{height:13px;overflow:hidden;background:rgba(16,43,88,.14);border:1px solid rgba(23,53,104,.35)}
    .meter-fill{display:block;height:100%;width:var(--meter-width);background:var(--team-color);border-right:3px solid var(--navy)}
    .rank-value{text-align:right;color:var(--navy);font-size:1.35rem;font-weight:900;white-space:nowrap}
    .empty{padding:24px;text-align:center;color:var(--muted);background:rgba(233,189,124,.45);border:2px dashed var(--line)}
    .error{padding:14px;background:var(--cream);border:3px solid var(--accent)}footer{border-top:4px solid var(--accent);text-align:center}
    @media(max-width:680px){header{align-items:flex-start;flex-direction:column}.controls{grid-template-columns:1fr}.season-control-row{grid-template-columns:minmax(0,1fr) auto}.season-control-row output{min-width:62px}.play-toggle{grid-column:1/-1}.rank-row{grid-template-columns:34px 42px minmax(0,1fr) auto;gap:8px;padding:8px}.rank-logo{width:38px;height:38px}.rank-name{font-size:1rem}.meter{grid-column:2/4;grid-row:2;height:9px;margin-top:-4px}.rank-value{grid-column:4;grid-row:1/3;font-size:1.15rem}.leaderboard-head{align-items:flex-start;flex-direction:column}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header><div class="brand">NBA Data Analysis</div><nav aria-label="Project pages"><a href="/">Home</a><a href="/league-analysis">League analysis</a><a href="/season-leaderboard" aria-current="page">Season leaderboard</a><a href="/compare-teams">Compare teams</a></nav></header>
  <main><div class="wrap">
    <section class="intro"><div class="eyebrow">One season · 30 teams · three measures</div><h1>Season leaderboard</h1></section>
    {% if error %}<div class="panel error" role="alert">{{ error }}</div>{% elif data %}
    <section class="panel">
      <div class="controls">
        <div class="control"><label for="season-slider">Season replay</label><div class="season-control-row"><input id="season-slider" type="range" min="0" max="{{ data.seasons|length - 1 }}" step="1" value="{{ data.seasons.index(data.selected_season) }}" aria-label="Choose season"><output id="season-output" for="season-slider" aria-live="polite"></output><button type="button" class="play-toggle" id="play-toggle" aria-pressed="false">▶ Play seasons</button></div></div>
        <div class="control"><label for="metric-select">Rank teams by</label><select id="metric-select"><option value="win_rate"{% if data.selected_metric == "win_rate" %} selected{% endif %}>Win rate</option><option value="attempts"{% if data.selected_metric == "attempts" %} selected{% endif %}>Bonus attempts per team-game</option><option value="accuracy"{% if data.selected_metric == "accuracy" %} selected{% endif %}>Bonus free-throw accuracy</option></select></div>
      </div>
    </section>
    <section class="panel" aria-live="polite">
      <div class="leaderboard-head"><div><div class="eyebrow" id="leaderboard-season"></div><h2 id="leaderboard-title"></h2><p class="metric-caption" id="metric-caption"></p></div><div class="eyebrow" id="team-count"></div></div>
      <div class="ranking" id="ranking"></div>
    </section>
    <script id="leaderboard-data" type="application/json">{{ data|tojson }}</script>
    <script>
      (() => {
        const data = JSON.parse(document.getElementById("leaderboard-data").textContent);
        const teams = Object.fromEntries(data.teams.map(team => [team.code, team]));
        const seasonSlider = document.getElementById("season-slider");
        const seasonOutput = document.getElementById("season-output");
        const playToggle = document.getElementById("play-toggle");
        const metricSelect = document.getElementById("metric-select");
        let replayTimer = null;
        const list = document.getElementById("ranking");
        const title = document.getElementById("leaderboard-title");
        const caption = document.getElementById("metric-caption");
        const seasonLabel = document.getElementById("leaderboard-season");
        const count = document.getElementById("team-count");
        const details = {
          win_rate: {title:"Winning percentage", caption:"Calculated as wins divided by games played in the selected season.", field:row=>row.games ? 100*row.wins/row.games : null, format:value=>value.toFixed(2)+"%"},
          attempts: {title:"Bonus attempts per team-game", caption:"Total bonus free-throw attempts divided by games played. This measures volume, not an automatic advantage.", field:row=>row.games ? row.attempts/row.games : null, format:value=>value.toFixed(2)},
          accuracy: {title:"Bonus free-throw accuracy", caption:"Total bonus free throws made divided by bonus attempts.", field:row=>row.attempts ? 100*row.made/row.attempts : null, format:value=>value.toFixed(2)+"%"}
        };
        function render() {
          const season = data.seasons[Number(seasonSlider.value)];
          const metric = details[metricSelect.value];
          const rows = data.rows.filter(row=>row.season===season).map(row=>({...row,value:metric.field(row)})).filter(row=>Number.isFinite(row.value)).sort((a,b)=>b.value-a.value);
          const max = Math.max(...rows.map(row=>row.value),0) || 1;
          seasonLabel.textContent = season + " season";
          seasonOutput.textContent = season;
          seasonSlider.setAttribute("aria-valuetext", season);
          title.textContent = metric.title;
          caption.textContent = metric.caption;
          count.textContent = rows.length + " teams with data";
          list.replaceChildren();
          if (!rows.length) {
            const empty=document.createElement("div");empty.className="empty";empty.textContent="There are no team results for this season and measure.";list.append(empty);return;
          }
          rows.forEach((row,index)=>{
            const team=teams[row.team];
            if(!team)return;
            const link=document.createElement("a");link.className="rank-row";link.href="/team/"+encodeURIComponent(team.code);link.style.setProperty("--team-color",team.primary_color);link.setAttribute("aria-label",(index+1)+". "+team.name+", "+metric.format(row.value)+". Open team season page.");
            const place=document.createElement("span");place.className="rank-number";place.textContent=String(index+1).padStart(2,"0");
            const logo=document.createElement("img");logo.className="rank-logo";logo.src="https://cdn.nba.com/logos/nba/"+team.logo_id+"/primary/L/logo.svg";logo.alt="";logo.loading="lazy";
            const name=document.createElement("span");name.className="rank-name";name.textContent=team.name;
            const meter=document.createElement("span");meter.className="meter";meter.setAttribute("aria-hidden","true");
            const fill=document.createElement("span");fill.className="meter-fill";fill.style.setProperty("--meter-width",(row.value/max*100)+"%");meter.append(fill);
            const value=document.createElement("strong");value.className="rank-value";value.textContent=metric.format(row.value);
            link.append(place,logo,name,meter,value);list.append(link);
          });
          const params=new URLSearchParams({season,metric:metricSelect.value});history.replaceState(null,"","/season-leaderboard?"+params.toString());
        }
        function stopReplay() {
          if (replayTimer !== null) {
            window.clearInterval(replayTimer);
            replayTimer = null;
          }
          playToggle.textContent = "▶ Play seasons";
          playToggle.setAttribute("aria-pressed", "false");
        }
        playToggle.addEventListener("click", () => {
          if (replayTimer !== null) {
            stopReplay();
            return;
          }
          if (Number(seasonSlider.value) >= Number(seasonSlider.max)) {
            seasonSlider.value = "0";
            render();
          }
          playToggle.textContent = "❚❚ Pause";
          playToggle.setAttribute("aria-pressed", "true");
          replayTimer = window.setInterval(() => {
            const next = Number(seasonSlider.value) + 1;
            seasonSlider.value = String(next);
            render();
            if (next >= Number(seasonSlider.max)) stopReplay();
          }, 900);
        });
        seasonSlider.addEventListener("input", () => {
          stopReplay();
          render();
        });
        metricSelect.addEventListener("change",render);
        render();
      })();
    </script>
    {% endif %}
  </div></main>
  <footer>NBA play-by-play analysis · Team-season results from TiDB · Associations do not establish cause.</footer>
</body>
</html>
